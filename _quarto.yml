project:
  type: website
  output-dir: docs
  # Only index.qmd is a page. Question files (topic/**/_*.qmd), archive/,
  # _README/ and the .md notes are pulled in or ignored, never rendered alone.
  render:
    - index.qmd


website:
  title: "TAC"
  navbar:
    left:
      - href: index.qmd
        text: Home

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    html-math-method: mathjax
    format:
    include-in-header: login-header.html
    include-before-body: login.html

# The quiz filter (our _extensions/quiz) runs first, before Quarto reads the
# page (`at: pre-ast`), so the callouts/tabsets it writes are handled exactly
# like hand-written ones. It is listed by path because `at:` needs a path.
# `diagram` (pandoc-ext/diagram) then turns the TikZ blocks into SVGs.
filters:
  - path: _extensions/quiz/quiz.lua
    at: pre-ast
  - diagram

diagram:
  # Reuse SVGs whose TikZ hasn't changed, so renders stay fast.
  cache: false
  cache-dir: ./_tikz-cache

  engine:
    tikz:
      # LaTeX engine used to compile each ```{.tikz} block.
      # pdflatex also works; lualatex handles fonts better.
      execpath: lualatex

      # THIS is the preamble that actually reaches every diagram. Add packages,
      # libraries and styles here, ONE LaTeX command per list item (two commands
      # in one item get a stray "\\" between them and the diagram fails).
      header-includes:
        - \usepackage{amsmath,amssymb}
        - \usetikzlibrary{angles,quotes,calc,patterns, decorations.pathreplacing, arrows.meta,positioning,intersections}
        - \tikzset{
          circ/.style     = {line width=0.9pt},
          seg/.style      = {line width=0.9pt},
          center dot/.style = {circle, fill, inner sep=1.3pt},
          dim brace/.style  = {decorate, decoration={brace, amplitude=7pt, raise=4pt}, line width=0.7pt},
          callout/.style    = {-{Stealth[length=2mm]}, line width=0.6pt},
          }
      # NOT APPLIED: the diagram filter turns this `|` block into plain text,
      # which drops the LaTeX, so none of these packages are loaded (checked
      # Nov 2026: it arrives empty). Kept for reference; use header-includes.
      additional-packages: |
        \usepackage[margin=1in]{geometry}
        \usepackage[T1]{fontenc}
        \usepackage{lmodern}
        \usepackage{amsmath,amssymb}
        \usepackage{tikz} 
        \usepackage{pgfplots}
        \usepackage{tkz-euclide}
        \pgfplotsset{compat=1.18}
        \usetikzlibrary{angles,quotes,calc,patterns, decorations.pathreplacing, arrows.meta, supplementary, trig,positioning,intersections}
        \tikzset{
          circ/.style     = {line width=0.9pt},
          seg/.style      = {line width=0.9pt},
          center dot/.style = {circle, fill, inner sep=1.3pt},
          dim brace/.style  = {decorate, decoration={brace, amplitude=7pt, raise=4pt}, line width=0.7pt},
          callout/.style    = {-{Stealth[length=2mm]}, line width=0.6pt},
        }
        \usepackage{tasks}
        \usepackage{caption} 
        \usepackage{needspace}
