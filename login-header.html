<style>
    #login-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
    }

    html.authed #login-overlay {
        display: none;
    }

    html:not(.authed) body {
        overflow: hidden;
    }

    #login-form {
        background: white;
        padding: 2rem 2.5rem;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, .1);
        display: flex;
        flex-direction: column;
        gap: .75rem;
        width: 300px;
    }

    #login-form h2 {
        margin: 0 0 .5rem;
        text-align: center;
    }

    #login-form input {
        padding: .6rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
    }

    #login-form button {
        padding: .6rem;
        border: none;
        border-radius: 6px;
        background: #2c7be5;
        color: white;
        font-size: 1rem;
        cursor: pointer;
    }

    #login-form button:hover {
        background: #1a68d1;
    }

    #login-error {
        color: #c0392b;
        font-size: .9rem;
        margin: 0;
        min-height: 1.2em;
        text-align: center;
    }
</style>
<script>
    if (sessionStorage.getItem("authed") === "1") {
        document.documentElement.classList.add("authed");
    }
</script>
